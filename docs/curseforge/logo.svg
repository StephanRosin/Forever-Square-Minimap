<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <radialGradient id="land" cx="45%" cy="45%" r="75%">
      <stop offset="0" stop-color="#7c9a4a"/>
      <stop offset="0.55" stop-color="#5b7a36"/>
      <stop offset="1" stop-color="#3a5224"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7fb8"/><stop offset="1" stop-color="#1f4f86"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4258"/><stop offset="1" stop-color="#1a1f2c"/>
    </linearGradient>
    <clipPath id="map"><rect x="96" y="96" width="300" height="300"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- the square map -->
  <g filter="url(#shadow)">
    <rect x="88" y="88" width="316" height="316" rx="6" fill="url(#gold)"/>
    <rect x="96" y="96" width="300" height="300" fill="#0a0d14"/>
  </g>
  <g clip-path="url(#map)">
    <rect x="96" y="96" width="300" height="300" fill="url(#land)"/>
    <!-- lake and river -->
    <path d="M96 300 C150 280 170 330 230 322 C290 314 300 360 396 350 L396 396 L96 396 Z" fill="url(#water)"/>
    <path d="M250 96 C240 150 280 180 262 230 C250 262 220 280 226 322" stroke="url(#water)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- hills and forest -->
    <path d="M96 170 C140 140 180 160 200 130 C215 110 240 110 250 96 L96 96 Z" fill="#8a7a4a" opacity="0.75"/>
    <circle cx="330" cy="160" r="26" fill="#2f4a1e" opacity="0.8"/>
    <circle cx="360" cy="200" r="20" fill="#2f4a1e" opacity="0.8"/>
    <circle cx="150" cy="240" r="22" fill="#2f4a1e" opacity="0.7"/>
    <!-- road -->
    <path d="M96 220 C160 230 200 210 246 250 C300 290 340 250 396 262" stroke="#c9b27a" stroke-width="5" fill="none" stroke-dasharray="10 7" opacity="0.85"/>
  </g>

  <!-- zone text bar -->
  <rect x="146" y="108" width="200" height="30" rx="15" fill="#000" opacity="0.45"/>
  <rect x="172" y="119" width="148" height="8" rx="4" fill="#ffd35a"/>

  <!-- player arrow -->
  <g filter="url(#glow)" transform="translate(246 246) rotate(-30)">
    <path d="M0 -30 L20 24 L0 12 L-20 24 Z" fill="#ffe89a" stroke="#6e4c12" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- quest / party dots -->
  <circle cx="190" cy="190" r="8" fill="#ffd35a" stroke="#000" stroke-width="2"/>
  <circle cx="310" cy="300" r="7" fill="#5aa0ff" stroke="#000" stroke-width="2"/>

  <!-- the button column on the right edge -->
  <g stroke="url(#gold)" stroke-width="4">
    <circle cx="438" cy="140" r="26" fill="url(#btn)"/>
    <circle cx="438" cy="206" r="26" fill="url(#btn)"/>
    <circle cx="438" cy="272" r="26" fill="url(#btn)"/>
  </g>
  <circle cx="438" cy="140" r="11" fill="none" stroke="#ffd35a" stroke-width="4"/>
  <path d="M438 140 L446 148" stroke="#ffd35a" stroke-width="4" stroke-linecap="round"/>
  <rect x="425" y="197" width="26" height="18" rx="2" fill="#e8e3d2"/>
  <path d="M425 197 L438 208 L451 197" stroke="#6e6a5a" stroke-width="2.5" fill="none"/>
  <path d="M428 282 L438 258 L448 282 Z" fill="#b58cf0"/>

  <!-- resize grip in the bottom left corner -->
  <g transform="translate(96 396)">
    <path d="M0 0 L0 -54 L54 0 Z" fill="#000" opacity="0.5"/>
    <path d="M8 -12 L12 -8 M8 -26 L26 -8 M8 -40 L40 -8" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- drag arrow -->
  <g stroke="#fff2b0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M90 420 L52 458"/>
    <path d="M52 430 L52 458 L80 458"/>
  </g>
</svg>
